name: Release clippy cleanup

on:
  push:
    branches:
      - release-v1.5.0-context-modes-voice-edit

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.5.0-context-modes-voice-edit
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply semantic Clippy fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          context = Path("src/context.rs")
          text = context.read_text(encoding="utf-8")
          old = 'fn parse_tabbed(value: &str) -> Option<(String, String, Option<String>)> {'
          if old not in text:
              raise SystemExit("Expected parse_tabbed declaration not found")
          text = text.replace(
              old,
              '#[cfg(any(target_os = "windows", target_os = "macos"))]\nfn parse_tabbed(value: &str) -> Option<(String, String, Option<String>)> {',
              1,
          )
          context.write_text(text, encoding="utf-8")

          recovery = Path("src/recovery.rs")
          text = recovery.read_text(encoding="utf-8")
          old = '''pub fn persist(
              samples: &[i16],
              profile: &str,
              model: &str,
              language: &str,
          ) -> Result<RecoveryItem> {
              persist_with_context(samples, profile, model, language, None, None, None)
          }

          '''
          if old not in text:
              raise SystemExit("Expected legacy recovery persist wrapper not found")
          text = text.replace(old, "", 1)
          recovery.write_text(text, encoding="utf-8")

          tracking = Path("src/tracking.rs")
          text = tracking.read_text(encoding="utf-8")
          old = '''pub fn build_record(
              model: &str,
              audio_duration_secs: f64,
              usage: &TokenUsage,
              transcription: &str,
          ) -> TranscriptionRecord {
              build_record_with_context(
                  model,
                  audio_duration_secs,
                  usage,
                  transcription,
                  None,
                  None,
                  None,
              )
          }

          '''
          if old not in text:
              raise SystemExit("Expected legacy tracking build_record wrapper not found")
          text = text.replace(old, "", 1)
          tracking.write_text(text, encoding="utf-8")

          app = Path("src/app.rs")
          text = app.read_text(encoding="utf-8")
          marker = '''    };
              if outcome.text.trim().is_empty() {
          '''
          if marker not in text:
              raise SystemExit("Expected transcription outcome marker not found")
          replacement = '''    };
              if let Some(primary_model) = outcome.fallback_from.as_deref() {
                  info!(
                      primary_model = %primary_model,
                      fallback_model = %outcome.model_used,
                      "Gemini transcription completed using fallback model"
                  );
              }
              if outcome.text.trim().is_empty() {
          '''
          text = text.replace(marker, replacement, 1)
          app.write_text(text, encoding="utf-8")
          PY

          rustfmt --edition 2021 --config skip_children=true \
            src/app.rs \
            src/context.rs \
            src/recovery.rs \
            src/tracking.rs

      - name: Commit semantic cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/context.rs src/recovery.rs src/tracking.rs
          if git diff --cached --quiet; then
            echo "No semantic cleanup required."
            exit 0
          fi
          git commit -m "fix: resolve v1.5 clippy blockers"
          git push origin HEAD:release-v1.5.0-context-modes-voice-edit
