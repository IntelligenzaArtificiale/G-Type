name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Test + Clippy + Fmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev \
            libx11-dev \
            libxtst-dev \
            libxdo-dev \
            libevdev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            libssl-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: UI JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for source in ('src/settings_ui.html', 'src/recovery_ui.html', 'src/setup_ui.html'):
              html = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
              if not scripts:
                  raise SystemExit(f'{source} contains no script block')
              target = Path('/tmp') / (Path(source).stem + '.js')
              target.write_text('\n'.join(scripts), encoding='utf-8')
              if re.search(r'\bonclick\s*=', html, re.I):
                  raise SystemExit(f'inline onclick handlers are forbidden in {source}')
          PY
          node --check /tmp/settings_ui.js
          node --check /tmp/recovery_ui.js
          node --check /tmp/setup_ui.js

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::get_first

      - name: Tests
        run: cargo test --all-features

  cross_platform:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross-platform cargo check
        run: cargo check --target ${{ matrix.target }}
