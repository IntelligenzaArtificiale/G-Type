name: Release test helper cleanup

on:
  push:
    branches:
      - release-v1.5.0-context-modes-voice-edit

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.5.0-context-modes-voice-edit
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove obsolete test helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/tracking.rs")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if line.strip().startswith("fn usage(prompt: u64, output: u64)")), None)
          if start is None:
              raise SystemExit("Expected obsolete tracking test helper not found")
          depth = 0
          end = None
          for i in range(start, len(lines)):
              depth += lines[i].count("{") - lines[i].count("}")
              if i > start and depth == 0:
                  end = i + 1
                  break
          if end is None:
              raise SystemExit("Could not locate end of obsolete tracking test helper")
          del lines[start:end]
          path.write_text("".join(lines), encoding="utf-8")
          PY
          cargo fmt -- src/tracking.rs

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tracking.rs
          if git diff --cached --quiet; then
            echo "No cleanup required."
            exit 0
          fi
          git commit -m "fix: remove obsolete tracking test helper"
          git push origin HEAD:release-v1.5.0-context-modes-voice-edit
