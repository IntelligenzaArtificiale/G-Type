name: Release source hygiene

on:
  push:
    branches:
      - release-v1.5.0-context-modes-voice-edit

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.5.0-context-modes-voice-edit
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply targeted source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("src/settings_v15.rs")
          text = settings.read_text(encoding="utf-8")

          old_import = "use std::collections::{BTreeMap, HashMap, HashSet};"
          if old_import not in text:
              raise SystemExit("Expected settings_v15 HashSet import not found")
          text = text.replace(old_import, "use std::collections::{BTreeMap, HashMap};", 1)

          old_map_err = 'let response=client.get(url).header("x-goog-api-key",api_key).send().await.map_err(|e|if e.is_timeout(){"Timeout durante la verifica della API key".into()}else{"Impossibile raggiungere Gemini per verificare la API key".into()})?;'
          if old_map_err not in text:
              raise SystemExit("Expected verify_gemini_key map_err expression not found")
          new_map_err = '''let response = client
              .get(url)
              .header("x-goog-api-key", api_key)
              .send()
              .await
              .map_err(|error| -> String {
                  if error.is_timeout() {
                      "Timeout durante la verifica della API key".to_string()
                  } else {
                      "Impossibile raggiungere Gemini per verificare la API key".to_string()
                  }
              })?;'''
          text = text.replace(old_map_err, new_map_err, 1)
          settings.write_text(text, encoding="utf-8")

          input_file = Path("src/input_v15.rs")
          text = input_file.read_text(encoding="utf-8")
          old_tracing = "use tracing::{error, info, warn};"
          if old_tracing not in text:
              raise SystemExit("Expected tracing import not found in input_v15.rs")
          text = text.replace(
              old_tracing,
              'use tracing::{error, info};\n#[cfg(target_os = "linux")]\nuse tracing::warn;',
              1,
          )
          input_file.write_text(text, encoding="utf-8")
          PY

          rustfmt --edition 2021 --config skip_children=true \
            src/app.rs \
            src/config.rs \
            src/context.rs \
            src/input_v15.rs \
            src/prompt.rs \
            src/providers/mod.rs \
            src/recovery.rs \
            src/selection.rs \
            src/settings_v15.rs \
            src/snippets.rs \
            src/tracking.rs

      - name: Commit source hygiene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app.rs \
            src/config.rs \
            src/context.rs \
            src/input_v15.rs \
            src/prompt.rs \
            src/providers/mod.rs \
            src/recovery.rs \
            src/selection.rs \
            src/settings_v15.rs \
            src/snippets.rs \
            src/tracking.rs
          if git diff --cached --quiet; then
            echo "No source hygiene changes required."
            exit 0
          fi
          git commit -m "chore: apply v1.5 source hygiene"
          git push origin HEAD:release-v1.5.0-context-modes-voice-edit
