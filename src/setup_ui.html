<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-Type | Setup Iniziale</title><script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{gray:{950:'#0a0a0a'}}}}}</script>
</head>
<body class="bg-gray-950 text-gray-200 font-sans antialiased min-h-screen flex flex-col justify-center items-center">
<div class="w-full max-w-lg mx-auto p-8">
<header class="text-center mb-10"><h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Benvenuto in G-Type</h1><p class="text-sm text-gray-500 mt-2 tracking-widest uppercase">The Zero Friction Dictation Daemon</p></header>
<form id="setupForm" class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl space-y-6">
<div><label class="block text-sm font-medium text-gray-400 mb-2">1. Google Gemini API Key</label><input type="password" id="api_key" required placeholder="AIzaSy..." class="w-full bg-gray-950 border border-gray-700 text-white rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"><p class="text-xs text-gray-600 mt-2">Ottieni una chiave su <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="text-blue-400 hover:underline">Google AI Studio</a>.</p></div>
<div><label class="block text-sm font-medium text-gray-400 mb-2">2. Scegli il modello</label><select id="model" required class="w-full bg-gray-950 border border-gray-700 text-white rounded-lg p-3 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-colors"><option value="">Caricamento modelli…</option></select><p id="modelNote" class="text-xs text-gray-600 mt-2">Sono mostrati solo modelli che supportano input audio e output testo nel flusso di dettatura.</p></div>
<div><label class="block text-sm font-medium text-gray-400 mb-2">3. Registra Hotkey</label><input type="text" id="hotkey" required readonly value="ctrl+shift+space" class="w-full bg-gray-950 border border-gray-700 text-white font-mono text-center rounded-lg p-3 outline-none cursor-pointer hover:border-blue-500 transition-colors focus:ring-2 focus:ring-blue-500"><p class="text-xs text-gray-600 mt-2 text-center">Clicca sull'input e premi i tasti che vuoi usare per avviare/fermare la dettatura.</p></div>
<div class="pt-6 border-t border-gray-800"><button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-bold rounded-lg shadow-lg transition">Salva e Avvia G-Type</button></div><div id="status" class="text-center text-sm font-medium hidden"></div>
</form></div>
<script>
const hotkeyInput=document.getElementById('hotkey'),modelSelect=document.getElementById('model');loadModels();
async function loadModels(){try{const res=await fetch('/api/models',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json(),models=data.models||[];modelSelect.innerHTML=models.map(m=>{const id='models/'+String(m.id).replace(/^models\//,'');const sel=id===data.recommended?' selected':'';return `<option value="${escapeHtml(id)}"${sel}>${escapeHtml(m.label)}${m.status==='preview'?' · Preview':''} · audio $${Number(m.input_audio_per_m||0).toFixed(2)}/M · out $${Number(m.output_per_m||0).toFixed(2)}/M</option>`}).join('');document.getElementById('modelNote').textContent='Prezzi standard Google in USD per 1M token · catalogo verificato '+(data.pricing_reviewed_at||'')}catch(error){console.error(error);modelSelect.innerHTML='<option value="models/gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>';document.getElementById('modelNote').textContent='Catalogo non raggiungibile: uso il modello stabile consigliato.'}}
hotkeyInput.addEventListener('focus',()=>{hotkeyInput.classList.add('border-blue-500','ring-2','ring-blue-500');hotkeyInput.value='';hotkeyInput.placeholder='Premi i tasti...'});hotkeyInput.addEventListener('blur',()=>{hotkeyInput.classList.remove('border-blue-500','ring-2','ring-blue-500');if(!hotkeyInput.value)hotkeyInput.value='ctrl+shift+space'});hotkeyInput.addEventListener('keydown',e=>{e.preventDefault();const keys=[];if(e.ctrlKey)keys.push('ctrl');if(e.shiftKey)keys.push('shift');if(e.altKey)keys.push('alt');if(e.metaKey)keys.push('super');let key=e.key.toLowerCase();if(key===' ')key='space';if(!['control','shift','alt','meta'].includes(key)){keys.push(key);hotkeyInput.value=keys.join('+');hotkeyInput.blur()}else hotkeyInput.value=keys.join('+')});
document.getElementById('setupForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('button[type="submit"]'),status=document.getElementById('status');btn.disabled=true;btn.textContent='Salvataggio in corso...';try{const res=await fetch('/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:document.getElementById('api_key').value,model:modelSelect.value,hotkey:hotkeyInput.value})});const data=await safeJson(res);if(!res.ok)throw new Error(data.error||'Errore di salvataggio');status.className='text-center text-sm font-medium text-emerald-400 mt-4';status.textContent='Configurazione salvata. G-Type è pronto.';setTimeout(()=>location.href='/',900)}catch(err){status.className='text-center text-sm font-medium text-red-500 mt-4';status.textContent=err.message||'Errore durante il salvataggio.';btn.disabled=false;btn.textContent='Riprova'}status.classList.remove('hidden')});
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function safeJson(r){try{return await r.json()}catch{return{}}}
</script></body></html>
