<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Type | Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#090909; color:#f4f4f5; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .shell { max-width:1080px; margin:0 auto; padding:38px 22px 60px; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:24px; padding-bottom:24px; border-bottom:1px solid #222; margin-bottom:30px; }
  .brand { font-size:25px; font-weight:800; letter-spacing:-.04em; }
  .version { color:#52525b; font-size:11px; margin-top:3px; }
  .stats { display:flex; gap:0; }
  .stat { min-width:120px; text-align:center; padding:0 22px; border-left:1px solid #222; }
  .stat:first-child { border-left:0; }
  .stat strong { display:block; font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .stat span { display:block; margin-top:5px; color:#52525b; font-size:11px; }
  .grid { display:grid; grid-template-columns:330px 1fr; gap:24px; align-items:start; }
  .stack { display:grid; gap:16px; }
  .card { background:#171717; border:1px solid #2a2a2a; border-radius:15px; padding:20px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .card h2 { margin:0; font-size:14px; font-weight:750; color:#fff; }
  .provider { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; }
  .badge { padding:4px 9px; border-radius:999px; font-size:10px; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
  .ok { color:#4ade80; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.25); }
  .warn { color:#fbbf24; background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.25); }
  button { font:inherit; }
  .btn { border:1px solid #363636; background:#222; color:#e4e4e7; border-radius:8px; padding:7px 11px; font-size:12px; font-weight:650; cursor:pointer; }
  .btn:hover { background:#2c2c2c; color:#fff; }
  .btn-blue { background:#2563eb; border-color:#2563eb; color:white; }
  .btn-blue:hover { background:#1d4ed8; }
  .btn-red { color:#f87171; background:transparent; border-color:transparent; }
  .profile { background:#101010; border:1px solid #292929; border-radius:11px; padding:14px; margin-top:10px; }
  .profile-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .profile-name { font-size:14px; font-weight:750; color:#f4f4f5; }
  .mono { font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace; color:#a1a1aa; margin-top:4px; }
  .muted { color:#52525b; font-size:11px; margin-top:3px; }
  .actions { display:flex; gap:6px; }
  .editor { display:none; border-top:1px solid #292929; margin-top:13px; padding-top:13px; }
  .editor.open { display:block; }
  .form-grid { display:grid; gap:11px; }
  label { display:block; color:#71717a; font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
  input, select, textarea { width:100%; background:#0d0d0d; border:1px solid #333; border-radius:8px; color:#f4f4f5; padding:9px 10px; outline:none; font-size:13px; }
  input:focus, select:focus, textarea:focus { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.12); }
  textarea { min-height:88px; resize:vertical; }
  .hint { color:#52525b; font-size:10px; margin-top:5px; }
  .history-card { min-height:620px; display:flex; flex-direction:column; }
  .history-list { display:grid; gap:9px; flex:1; }
  .history-item { background:#121212; border:1px solid #282828; border-radius:11px; padding:14px 16px; }
  .history-meta { display:flex; flex-wrap:wrap; align-items:center; gap:10px; color:#52525b; font-size:10px; margin-bottom:10px; }
  .history-meta .cost { margin-left:auto; }
  .history-text { color:#e4e4e7; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .history-text.collapsed { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .history-actions { display:flex; gap:10px; margin-top:9px; }
  .link { border:0; padding:0; background:none; color:#3b82f6; font-size:11px; cursor:pointer; }
  .pager { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding-top:16px; border-top:1px solid #222; }
  .empty { color:#52525b; font-size:13px; text-align:center; padding:60px 20px; }
  #toast { position:fixed; right:24px; bottom:24px; z-index:99; padding:12px 16px; border-radius:10px; background:#202020; border:1px solid #3a3a3a; box-shadow:0 12px 35px rgba(0,0,0,.5); font-size:13px; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s ease; }
  #toast.show { opacity:1; transform:none; }
  #toast.error { border-color:#7f1d1d; color:#fecaca; }
  @media (max-width:820px) {
    .header { align-items:flex-start; flex-direction:column; }
    .stats { width:100%; justify-content:space-between; }
    .stat { min-width:0; flex:1; padding:0 10px; }
    .grid { grid-template-columns:1fr; }
    .history-card { min-height:auto; }
  }
</style>
</head>
<body>
<div id="toast"></div>
<div class="shell">
  <header class="header">
    <div>
      <div class="brand">G-Type</div>
      <div class="version" id="version">Dashboard locale</div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="stat-money" style="color:#34d399">—</strong><span>Costo totale</span></div>
      <div class="stat"><strong id="stat-time" style="color:#60a5fa">—</strong><span>Tempo risparmiato</span></div>
      <div class="stat"><strong id="stat-words" style="color:#c084fc">—</strong><span>Parole dettate</span></div>
    </div>
  </header>

  <main class="grid">
    <aside class="stack">
      <section class="card">
        <div class="card-head"><h2>Provider API</h2></div>
        <div id="provider-list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Profili</h2>
          <button class="btn btn-blue" onclick="toggleCreate(true)">+ Nuovo</button>
        </div>
        <div id="profile-list"></div>
      </section>

      <section class="card" id="create-card" style="display:none;border-color:#1d4ed8">
        <div class="card-head"><h2>Nuovo profilo</h2></div>
        <div class="form-grid">
          <div><label>Nome</label><input id="new-name" placeholder="es. dictation-work"></div>
          <div><label>Hotkey</label><input id="new-hotkey" class="mono" placeholder="ctrl+shift+space"><div class="hint">Esempi: ctrl+shift+space, alt+r, ctrl+f8</div></div>
          <div><label>Modello</label><select id="new-model"></select></div>
          <div><label>Prompt personalizzato</label><textarea id="new-prompt" placeholder="Opzionale"></textarea></div>
          <div style="display:flex;gap:8px"><button class="btn btn-blue" onclick="createProfile()">Crea</button><button class="btn" onclick="toggleCreate(false)">Annulla</button></div>
        </div>
      </section>
    </aside>

    <section class="card history-card">
      <div class="card-head"><h2>Cronologia trascrizioni</h2><span id="history-count" class="muted"></span></div>
      <div id="history-list" class="history-list"></div>
      <div id="pager" class="pager" style="display:none">
        <button class="btn" id="prev" onclick="changePage(-1)">← Precedente</button>
        <span class="muted" id="page-info"></span>
        <button class="btn" id="next" onclick="changePage(1)">Successiva →</button>
      </div>
    </section>
  </main>
</div>

<script>
const MODELS = [
  ['models/gemini-2.0-flash','gemini-2.0-flash'],
  ['models/gemini-2.5-flash','gemini-2.5-flash'],
  ['models/gemini-2.5-flash-lite','gemini-2.5-flash-lite'],
  ['models/gemini-2.5-pro','gemini-2.5-pro']
];
let appConfig = null;
let allRecords = [];
let currentPage = 0;
const PAGE_SIZE = 5;

function modelOptions(selected) {
  return MODELS.map(([v,l]) => `<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('');
}

document.getElementById('new-model').innerHTML = modelOptions('models/gemini-2.5-flash');
init();

async function init() {
  await Promise.all([loadState(), loadHistory()]);
}

async function loadState() {
  try {
    const res = await fetch('/api/state', {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    appConfig = data.config;
    const s = data.stats || {};
    document.getElementById('stat-money').textContent = '$' + Number(s.total_cost_usd || 0).toFixed(4);
    document.getElementById('stat-time').textContent = formatDur(s.time_saved_secs || 0);
    document.getElementById('stat-words').textContent = Number(s.total_words || 0).toLocaleString('it-IT');
    document.getElementById('version').textContent = 'v' + ((data.runtime && data.runtime.version) || '?') + (data.runtime && data.runtime.live_profile_reload ? ' · modifiche profili live' : '');
    renderProvider();
    renderProfiles();
  } catch (e) {
    toast('Dashboard non connessa al daemon', true);
    console.error(e);
  }
}

function renderProvider() {
  const keys = (appConfig && appConfig.keys) || {};
  const active = !!(keys.gemini && String(keys.gemini).length > 0);
  document.getElementById('provider-list').innerHTML = `<div class="provider"><span>Google Gemini</span><span class="badge ${active?'ok':'warn'}">${active?'✓ attivo':'! mancante'}</span></div>`;
}

function renderProfiles() {
  const list = document.getElementById('profile-list');
  const profiles = (appConfig && appConfig.profiles) || [];
  if (!profiles.length) { list.innerHTML = '<div class="empty">Nessun profilo.</div>'; return; }
  list.innerHTML = profiles.map((p,i) => {
    const id = 'edit-'+i;
    const canDelete = profiles.length > 1;
    return `<div class="profile">
      <div class="profile-top">
        <div style="min-width:0">
          <div class="profile-name">${esc(p.name)}</div>
          <div class="mono">${esc(p.hotkey)}</div>
          <div class="muted">${esc(String(p.model||'').replace('models/',''))}</div>
        </div>
        <div class="actions">
          <button class="btn" onclick="toggleEditor('${id}')">Modifica</button>
          ${canDelete?`<button class="btn btn-red" onclick='deleteProfile(${JSON.stringify(p.name)})'>✕</button>`:''}
        </div>
      </div>
      <div class="editor" id="${id}">
        <div class="form-grid">
          <div><label>Nome</label><input id="${id}-name" value="${escAttr(p.name)}"></div>
          <div><label>Hotkey</label><input id="${id}-hotkey" class="mono" value="${escAttr(p.hotkey)}"><div class="hint">La nuova hotkey diventa attiva automaticamente entro circa 1 secondo.</div></div>
          <div><label>Modello</label><select id="${id}-model">${modelOptions(p.model)}</select></div>
          <div><label>Prompt personalizzato</label><textarea id="${id}-prompt" placeholder="Lascia vuoto per il prompt predefinito">${esc(p.custom_prompt||'')}</textarea></div>
          <div style="display:flex;gap:8px"><button class="btn btn-blue" onclick='saveProfile(${JSON.stringify(p.name)},${JSON.stringify(id)})'>Salva modifiche</button><button class="btn" onclick="toggleEditor('${id}')">Annulla</button></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleEditor(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function toggleCreate(show) {
  document.getElementById('create-card').style.display = show ? 'block' : 'none';
  if (show) document.getElementById('new-name').focus();
}

async function saveProfile(currentName,id) {
  const payload = {
    name: document.getElementById(id+'-name').value.trim(),
    hotkey: document.getElementById(id+'-hotkey').value.trim(),
    model: document.getElementById(id+'-model').value,
    provider: 'gemini',
    custom_prompt: document.getElementById(id+'-prompt').value.trim() || null
  };
  if (!payload.name || !payload.hotkey) return toast('Nome e hotkey sono obbligatori', true);
  const res = await fetch('/api/profiles/'+encodeURIComponent(currentName), {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data = await safeJson(res);
  if (!res.ok) return toast(data.error || 'Errore salvataggio', true);
  toast('Profilo aggiornato: hotkey e impostazioni applicate live');
  await loadState();
}

async function createProfile() {
  const payload = {
    name: document.getElementById('new-name').value.trim(),
    hotkey: document.getElementById('new-hotkey').value.trim(),
    model: document.getElementById('new-model').value,
    provider: 'gemini',
    custom_prompt: document.getElementById('new-prompt').value.trim() || null
  };
  if (!payload.name || !payload.hotkey) return toast('Nome e hotkey sono obbligatori', true);
  const res = await fetch('/api/profiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data = await safeJson(res);
  if (!res.ok) return toast(data.error || 'Errore creazione profilo', true);
  document.getElementById('new-name').value=''; document.getElementById('new-hotkey').value=''; document.getElementById('new-prompt').value='';
  toggleCreate(false); toast('Profilo creato e attivo senza riavvio'); await loadState();
}

async function deleteProfile(name) {
  if (!confirm(`Eliminare il profilo "${name}"?`)) return;
  const res = await fetch('/api/profiles/'+encodeURIComponent(name),{method:'DELETE'});
  const data = await safeJson(res);
  if (!res.ok) return toast(data.error || 'Errore eliminazione', true);
  toast('Profilo eliminato'); await loadState();
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history',{cache:'no-store'});
    if (!res.ok) throw new Error('HTTP '+res.status);
    allRecords = await res.json() || [];
    currentPage = 0;
    renderHistory();
  } catch(e) {
    document.getElementById('history-list').innerHTML = '<div class="empty">Impossibile caricare la cronologia.</div>';
  }
}

function renderHistory() {
  const list = document.getElementById('history-list');
  document.getElementById('history-count').textContent = allRecords.length + ' registrazioni';
  if (!allRecords.length) { list.innerHTML='<div class="empty">Nessuna trascrizione ancora.</div>'; document.getElementById('pager').style.display='none'; return; }
  const pages = Math.ceil(allRecords.length/PAGE_SIZE);
  currentPage = Math.max(0,Math.min(currentPage,pages-1));
  const rows = allRecords.slice(currentPage*PAGE_SIZE,currentPage*PAGE_SIZE+PAGE_SIZE);
  list.innerHTML = rows.map((r,i) => {
    const id = 'txt-'+currentPage+'-'+i;
    const seconds = Number(r.duration_secs || r.audio_duration_secs || 0);
    const words = Number(r.words || r.word_count || 0);
    const model = String(r.model || '').replace('models/','');
    const cost = Number(r.cost_usd || r.cost || 0);
    return `<article class="history-item">
      <div class="history-meta"><span>${esc(r.timestamp || '')}</span><span>${seconds.toFixed(1)}s</span><span>${words} parole</span><span>${esc(model)}</span><span class="cost">$${cost.toFixed(5)}</span></div>
      <div class="history-text collapsed" id="${id}">${esc(r.text || '')}</div>
      <div class="history-actions"><button class="link" onclick="toggleText('${id}',this)">Mostra tutto</button><button class="link" onclick='copyText(${JSON.stringify(r.text||'')})'>Copia</button></div>
    </article>`;
  }).join('');
  const pager = document.getElementById('pager'); pager.style.display=pages>1?'flex':'none';
  document.getElementById('page-info').textContent=`Pagina ${currentPage+1} di ${pages}`;
  document.getElementById('prev').disabled=currentPage===0; document.getElementById('next').disabled=currentPage>=pages-1;
}

function changePage(delta){ currentPage += delta; renderHistory(); window.scrollTo({top:0,behavior:'smooth'}); }
function toggleText(id,btn){ const el=document.getElementById(id); const collapsed=el.classList.toggle('collapsed'); btn.textContent=collapsed?'Mostra tutto':'Riduci'; }
async function copyText(text){ try { await navigator.clipboard.writeText(text); toast('Testo copiato'); } catch(e){ toast('Copia non disponibile',true); } }
function formatDur(sec){ sec=Number(sec||0); if(sec>=3600)return (sec/3600).toFixed(1)+'h'; if(sec>=60)return Math.round(sec/60)+'m'; return Math.round(sec)+'s'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
async function safeJson(res){ try{return await res.json();}catch(e){return{};} }
let toastTimer; function toast(msg,error=false){ const el=document.getElementById('toast'); el.textContent=msg; el.className=error?'show error':'show'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='',3000); }
</script>
</body>
</html>
