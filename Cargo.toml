[package]
name = "g-type"
version = "1.5.0"
edition = "2021"
description = "Local-first context-aware voice input powered by Gemini"
license = "MIT"
repository = "https://github.com/IntelligenzaArtificiale/G-Type"
readme = "README.md"

[[bin]]
name = "g-type"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
cpal = "0.15"
rdev = "0.5"
enigo = { version = "0.2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
directories = "5"
arboard = "3.6.1"
rodio = "0.20.1"
reqwest-retry = "0.8"
reqwest-middleware = { version = "0.4", features = ["json"] }
colored = "2"
tungstenite = "0.29.0"
open = "5.3.3"
socket2 = "0.5"
portpicker = "0.1.1"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
rand = "0.10.0"
uuid = "1.23.0"
tray-icon = "0.19"
muda = "0.15"
wry = "0.46"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
